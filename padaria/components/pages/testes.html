<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <button id="meuBotao">Clica em mim</button>
    <script>
        const botao = document.querySelector('#meuBotao');

    botao.addEventListener("click", function() {
        if (botao.textContent === "Clica em mim") {
            botao.textContent = "Ei! Isso doi!";
        } else if (botao.textContent === "Ei! Isso doi!") {
            botao.textContent = "Errou de novo!"; 
               } else {
                botao.textContent = "Clica em mim";
        }
    });
    </script>
</body>
</html>
